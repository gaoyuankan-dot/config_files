# ~/.config/tmux/tmux.conf: tmux >= 3.2 reads this XDG path (Ubuntu 26.04
# ships 3.6, Arch 3.8). Reload inside tmux: prefix + r.
# Check it: `tmux source-file -n <this file>` only PARSES, so it accepts an
# unknown option name; `make test` runs the file in a throwaway server instead.

# ── Terminal and colors ─────────────────────────────────────────────────
# Programs inside tmux see TERM=tmux-256color (italics, proper key codes).
set -g default-terminal "tmux-256color"
# Tell tmux the OUTER terminal (Windows Terminal, Konsole: TERM=xterm-256color)
# can draw 24-bit color, so true colors pass through instead of being rounded.
set -as terminal-features ",xterm-256color:RGB,xterm-kitty:RGB,alacritty:RGB"

# ── Vim friendliness ────────────────────────────────────────────────────
# After Esc, tmux waits this long to see if more bytes follow (an Alt-key or
# arrow sequence). The default 500 ms makes every Esc in vim feel laggy.
set -sg escape-time 10
set -g focus-events on        # vim gets FocusGained: autoread and gitgutter refresh

# ── Behavior ────────────────────────────────────────────────────────────
set -g history-limit 50000
set -g mouse on               # click panes, drag borders, wheel scrolls into copy mode
set -g base-index 1           # windows numbered 1.. (the 1 key is closer than 0)
setw -g pane-base-index 1
set -g renumber-windows on    # close window 2 of 3: 3 becomes 2
setw -g mode-keys vi          # copy mode uses vi keys
# Copy-mode yanks also go to the system clipboard through the terminal
# (OSC 52), which works in Windows Terminal and Konsole, and over ssh.
set -g set-clipboard on

# ── Keys ────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
# Splits and new windows start in the CURRENT pane's directory, not $HOME.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"
# Move between panes with h/j/k/l, like vim windows.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# In copy mode: v starts a selection, y copies it and leaves copy mode.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── Status bar (Catppuccin Mocha colors, like the terminal) ─────────────
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#a6adc8]%Y-%m-%d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
